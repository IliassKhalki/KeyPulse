[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keypulse"
version = "0.1.0"
description = "Native Windows desktop analytics tool for tracking per-game keyboard and mouse usage."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "KeyPulse" }]
dependencies = [
  "PySide6>=6.7",
  "SQLAlchemy>=2.0",
  "psutil>=5.9",
  "pynput>=1.7",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "pyinstaller>=6.8",
]

[project.scripts]
keypulse = "game_input_tracker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
game_input_tracker = ["assets/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
